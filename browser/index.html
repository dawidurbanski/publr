<!DOCTYPE html>
<html>
<head>
    <title>Zig CMS</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        /* Skeleton shown while WASM loads */
        body:not(.admin) {
            margin: 0;
            background: #22262f;
        }
        /* Suppress nav-slider transitions on page swap in browser preview */
        .nav-slider { transition: none !important; }
        .nav-panel { transition: none !important; }
    </style>
</head>
<body>

    <script type="module">
        // Absolute path so the SPA fallback (opening /admin/login directly)
        // still loads the runtime from the project root rather than from
        // /admin/cms-runtime.js. cms-runtime.js then resolves
        // ./cms-worker.js against its own import.meta.url, which is /.
        import { initCMS } from '/cms-runtime.js';
        // Register PublrJS + store factories BEFORE any admin HTML lands: the
        // swap path's Publr.hydrate() must find them on the FIRST login→admin
        // transition, where dynamically recreated module scripts would
        // otherwise race it. publr-admin.js is the layouts' single bootstrap
        // (runtime + DS stores + layout-wide app stores); the rest are the
        // page-scoped stores whose script tags live in swapped bodies.
        import '../static/scripts/publr-admin.js';
        import '../static/scripts/media-library.js';
        import '../static/scripts/media-edit.js';
        import '../static/scripts/kv-picker.js';
        import '../static/scripts/ws.js';
        import '../static/scripts/presence.js';

        let cms = null;

        async function handleFormSubmit(e) {
            const form = e.target.closest('form');
            if (!form) return;

            // Skip file upload form — handled by media-library.js startUpload()
            if (form.id === 'media-upload-form') return;

            e.preventDefault();
            const action = form.getAttribute('action') || location.pathname;
            const formData = new URLSearchParams(new FormData(form)).toString();
            await navigate(action, formData, 'POST');
            await cms.save();
        }

        // Global delegation: catch submit on dynamically created forms too
        document.addEventListener('submit', handleFormSubmit);

        // Route /admin/* fetch() calls through the WASM CMS. Admin stores do
        // direct `fetch('/admin/action', ...)` for autosave and similar AJAX
        // — in the dev shell those would hit the static dev server (405).
        // Same for XMLHttpRequest, patched below.
        const _origFetch = window.fetch.bind(window);
        window.fetch = async function(input, init) {
            const urlStr = typeof input === 'string' ? input : (input && input.url) || '';
            const isAdminLocal = urlStr.startsWith('/admin') ||
                urlStr.startsWith(location.origin + '/admin');
            if (cms && isAdminLocal) {
                const url = new URL(urlStr, location.origin);
                const path = url.pathname + url.search;
                const method = (init && init.method) || 'GET';
                let body = '';
                if (init && init.body != null) {
                    body = typeof init.body === 'string' ? init.body : String(init.body);
                }
                const res = await cms.request(method, path, body);
                const trimmed = (res.body || '').trimStart();
                const ct = (trimmed.startsWith('{') || trimmed.startsWith('['))
                    ? 'application/json' : 'text/html; charset=utf-8';
                return new Response(res.body, {
                    status: res.status || 200,
                    headers: { 'Content-Type': ct },
                });
            }
            return _origFetch(input, init);
        };

        // Mirror for XMLHttpRequest. media-library.js still has one XHR path
        // (media upload fallback) that hits /admin/action when
        // cms.requestBinary isn't wired up — keep it functional for the
        // dev shell by routing through cms.request.
        const _XHROpen = XMLHttpRequest.prototype.open;
        const _XHRSend = XMLHttpRequest.prototype.send;
        XMLHttpRequest.prototype.open = function(method, url) {
            this._publr = { method, url: String(url) };
            return _XHROpen.apply(this, arguments);
        };
        XMLHttpRequest.prototype.send = function(body) {
            const ctx = this._publr;
            if (cms && ctx && (ctx.url.startsWith('/admin') ||
                ctx.url.startsWith(location.origin + '/admin'))) {
                const xhr = this;
                const u = new URL(ctx.url, location.origin);
                const path = u.pathname + u.search;
                cms.request(ctx.method, path, typeof body === 'string' ? body : '')
                    .then(res => {
                        Object.defineProperty(xhr, 'readyState', { value: 4, configurable: true });
                        Object.defineProperty(xhr, 'status', { value: res.status || 200, configurable: true });
                        Object.defineProperty(xhr, 'responseText', { value: res.body || '', configurable: true });
                        Object.defineProperty(xhr, 'response', { value: res.body || '', configurable: true });
                        xhr.onreadystatechange && xhr.onreadystatechange();
                        xhr.onload && xhr.onload();
                    })
                    .catch(() => {
                        xhr.onerror && xhr.onerror();
                    });
                return;
            }
            return _XHRSend.apply(this, arguments);
        };

        let headSynced = false;

        // On first response from the WASM, copy the layout.zsx-rendered <head>
        // (inline styles, theme init script, icon, html class) into the live
        // document so the dev shell mirrors the native render. Skip the
        // tokens.css / publr.css <link>s — those URLs aren't served over HTTP;
        // we inject their contents inline via cms.request below.
        function syncHead(doc) {
            if (headSynced) return;
            if (doc.documentElement.className) {
                document.documentElement.className = doc.documentElement.className;
            }
            for (const el of [...doc.head.children]) {
                if (el.tagName === 'TITLE') continue;
                if (el.tagName === 'LINK' && el.getAttribute('rel') === 'stylesheet') {
                    const href = el.getAttribute('href');
                    if (href === '/static/styles/tokens.css' || href === '/static/styles/publr.css') continue;
                    if (href && document.head.querySelector('link[href="' + href + '"]')) continue;
                }
                if (el.tagName === 'SCRIPT') {
                    const s = document.createElement('script');
                    for (const a of el.attributes) s.setAttribute(a.name, a.value);
                    s.textContent = el.textContent;
                    document.head.appendChild(s);
                } else {
                    document.head.appendChild(el.cloneNode(true));
                }
            }
            headSynced = true;
        }

        async function navigate(path, body = '', method = 'GET') {
            const res = await cms.request(method, path, body);

            // Handle redirects
            if (res.status === 302 && res.redirect) {
                history.pushState({}, '', res.redirect);
                return navigate(res.redirect);
            }

            // Update URL
            if (method === 'GET' && window.location.pathname !== path) {
                history.pushState({}, '', path);
            }

            // Replace the entire document with the response HTML
            const parser = new DOMParser();
            const doc = parser.parseFromString(res.body, 'text/html');
            document.title = doc.title || 'Publr';

            syncHead(doc);

            // Replace body. PublrJS islands must be torn down BEFORE the swap
            // (their portalled content and effects reference the old subtree)
            // and re-hydrated after — cached module scripts won't re-run.
            try { window.Publr?.destroy(document.body); } catch (e) {}
            document.body.className = doc.body.className;
            document.body.innerHTML = doc.body.innerHTML;

            // <script> tags inserted via innerHTML don't execute (HTML spec).
            // Recreate each one so theme-toggle handler, module loaders, etc.
            // actually run after the swap. ES-module srcs are cached by URL so
            // external scripts won't double-execute — but a page-scoped module
            // seen for the FIRST time must finish evaluating (registering its
            // store factory) BEFORE hydrate() runs, so await external loads.
            const scriptLoads = [];
            for (const oldScript of document.body.querySelectorAll('script')) {
                const s = document.createElement('script');
                for (const a of oldScript.attributes) s.setAttribute(a.name, a.value);
                s.textContent = oldScript.textContent;
                if (s.src) scriptLoads.push(new Promise((done) => { s.onload = s.onerror = done; }));
                oldScript.replaceWith(s);
            }
            await Promise.all(scriptLoads);

            // Re-hydrate PublrJS islands and dispatch publr:init (the
            // "subtree re-initialized" signal stores listen for). The legacy
            // interact runtime is gone (#160) — stores register via their
            // modules.
            try {
                window.Publr?.hydrate(document.body);
                document.body.dispatchEvent(new CustomEvent('publr:init', { bubbles: true }));
            } catch (e) {}

            // Intercept links
            document.querySelectorAll('a[href^="/"]').forEach(a => {
                a.addEventListener('click', e => {
                    e.preventDefault();
                    navigate(a.getAttribute('href'));
                });
            });

            // Load media images via blob URLs
            document.querySelectorAll('img[src^="/media/"]').forEach(async img => {
                const mediaPath = img.getAttribute('src').replace(/^\/media\//, '');
                try {
                    const { data, contentType } = await cms.getMedia(mediaPath);
                    if (data && data.length > 0) {
                        const blob = new Blob([data], { type: contentType || 'application/octet-stream' });
                        img.src = URL.createObjectURL(blob);
                    }
                } catch (e) { /* leave broken image */ }
            });
        }

        // Browser back/forward
        window.addEventListener('popstate', () => navigate(location.pathname));

        // Fetch CSS assets through the WASM (which has them embedded) so
        // tokens and JIT-compiled utilities are available before navigate().
        async function injectCss(path, id) {
            if (document.getElementById(id)) return;
            const res = await cms.request('GET', path);
            if (!res || !res.body) return;
            const style = document.createElement('style');
            style.id = id;
            style.textContent = res.body;
            document.head.appendChild(style);
        }

        // Init
        (async () => {
            try {
                cms = await initCMS('/cms.wasm');
                window.cms = cms;
                window.navigate = navigate;

                // Auto-save periodically
                setInterval(() => cms.save(), 30000);

                // tokens.css and publr.css live only inside the WASM binary;
                // pull them out in the same order as the rendered <head>.
                await injectCss('/static/styles/tokens.css', 'tokens-css');
                await injectCss('/static/styles/publr.css', 'publr-css');

                // Navigate to current URL or default
                const path = location.pathname === '/' ? '/admin' : location.pathname;
                await navigate(path);
            } catch (e) {
                console.error(e);
            }
        })();
    </script>
</body>
</html>
